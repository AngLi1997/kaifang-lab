server {
        listen 80;
        server_name localhost; 
        location / {
              root /opt/kaifanglab/web/dist;
              index index.html index.htm;
              try_files $uri /index.html;
        }
        location ^~ /api/ {
                # 与 FILE_MAX_SIZE_MB 保持一致，Nginx 默认只允许 1MB 请求体
                client_max_body_size 100m;
                proxy_pass http://127.0.0.1:9999;
        }

}
