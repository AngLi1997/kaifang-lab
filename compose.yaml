name: kaifanglab

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: kaifang
      POSTGRES_USER: kaifang
      POSTGRES_PASSWORD: kaifang
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaifang -d kaifang"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
